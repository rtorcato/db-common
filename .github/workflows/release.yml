name: 🚀 Release

# On demand only, never per merge (#740): a dispatch (hotfix, ad hoc) or a
# closed milestone ("ship this batch").
on:
  workflow_dispatch:
  milestone:
    types: [closed]

jobs:
  # Is an approved release already publishing? Then this request must queue
  # behind it, not cancel it mid-publish (tag pushed, npm publish missing). One
  # still waiting for approval has published nothing, so superseding it is safe.
  in-flight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      publishing: ${{ steps.check.outputs.publishing }}
    steps:
      - name: 🔎 Check for a release already publishing
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publishing=false
          # A run waiting for approval is `waiting`, not `in_progress`.
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?status=in_progress" --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id"); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '.jobs[] | select(.status == "in_progress" and .name != "in-flight") | .name' | grep -q .; then
              publishing=true
            fi
          done
          echo "publishing=$publishing" >> "$GITHUB_OUTPUT"
          if [ "$publishing" = true ]; then
            echo "::notice::A release is already publishing; this one runs after it."
          fi

  release:
    needs: in-flight
    # Supersede a run still waiting for approval, never one publishing.
    concurrency:
      group: release
      cancel-in-progress: ${{ needs.in-flight.outputs.publishing != 'true' }}
    runs-on: ubuntu-latest
    # npm's trusted publisher is pinned to release.yml + the `release` environment;
    # without it the OIDC exchange returns `404 package not found`.
    environment: release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔧 Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # `files` is ["dist"] and nothing else builds it before `npm publish`.
      - name: 🏗️ Build
        run: pnpm run build

      # Workspace packages import the root package through its dist/, so this
      # must run after the root build.
      - name: 🏗️ Build workspace packages
        run: pnpm --filter './packages/*' build

      # OIDC trusted publishing needs npm CLI >= 11.5.1; the runner ships 10.x.
      - name: 📦 Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: 🚀 Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # semantic-release only releases the root package. db-drizzle's version is
      # bumped by hand in its package.json, so publish it when that version is
      # not on npm yet. It goes after the root release because it depends on
      # @rtorcato/db-common. `pnpm pack` rewrites `workspace:^` to a real range
      # (plain `npm publish` would ship `workspace:^` as-is); npm publishes the
      # tarball so OIDC trusted publishing applies. npm needs a trusted publisher
      # on @rtorcato/db-drizzle (this repo, release.yml, `release` environment).
      - name: 🚀 Publish @rtorcato/db-drizzle
        working-directory: packages/db-drizzle
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already on npm; nothing to publish."
            exit 0
          fi
          tarball=$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
          npm publish "$tarball"
