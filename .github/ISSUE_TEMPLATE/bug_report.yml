name: Bug report
description: Something isn't working as documented.
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@rtorcato/db-common"
        - "@rtorcato/db-drizzle"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug, including the expected vs. actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Code snippet or link to a small repro. Include the input you passed and the output you got.
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "1.4.1"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Node.js version, plus your database and driver (and Drizzle version) if relevant.
      placeholder: "Node 22.5.0, Postgres 17, drizzle-orm 0.45.2"
    validations:
      required: true
